services:
  # Remove the local single-Redis service inherited from docker-compose.yml.
  # Production uses two explicit fault domains below.
  redis: !reset null

  backend:
    environment:
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      REDIS_REALTIME_URL: redis://redis-realtime:6379/0
      CELERY_RESULT_BACKEND: redis://redis-cache:6379/1
    depends_on: !override
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis-cache:
        condition: service_healthy
      redis-realtime:
        condition: service_healthy

  agent-service:
    environment:
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      REDIS_REALTIME_URL: redis://redis-realtime:6379/0
      CELERY_RESULT_BACKEND: redis://redis-cache:6379/1
    depends_on: !override
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-realtime:
        condition: service_healthy

  celery-worker:
    command: celery -A ai_interview_backend worker -l info -Q celery,notifications --concurrency=4
    environment:
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      REDIS_REALTIME_URL: redis://redis-realtime:6379/0
      CELERY_RESULT_BACKEND: redis://redis-cache:6379/1

  celery-beat:
    environment:
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      REDIS_REALTIME_URL: redis://redis-realtime:6379/0
      CELERY_RESULT_BACKEND: redis://redis-cache:6379/1

  celery-agent-worker:
    image: ifaceoff/backend:latest
    command: celery -A ai_interview_backend worker -l info -Q agent --concurrency=${AGENT_WORKER_CONCURRENCY:-8} --prefetch-multiplier=1
    env_file:
      - ./.env.docker
    environment:
      IFACEOFF_RUN_MIGRATIONS: "0"
      IFACEOFF_COLLECTSTATIC: "0"
      IFACEOFF_DATABASE_URL: postgresql://${IFACEOFF_DB_USER:-ifaceoff_app}:${IFACEOFF_DB_PASSWORD:-ifaceoff-app-change-me}@postgres:5432/${IFACEOFF_DB_NAME:-ifaceoff_app}
      AGENT_DATABASE_URL: postgresql://${AGENT_DB_USER:-ifaceoff_agent}:${AGENT_DB_PASSWORD:-ifaceoff-agent-change-me}@postgres:5432/${AGENT_DB_NAME:-ifaceoff_agent}
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      REDIS_REALTIME_URL: redis://redis-realtime:6379/0
      CELERY_RESULT_BACKEND: redis://redis-cache:6379/1
      RABBITMQ_HOST: rabbitmq
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-realtime:
        condition: service_healthy
    networks:
      - ifaceoff_network

  celery-document-worker:
    image: ifaceoff/backend:latest
    command: celery -A ai_interview_backend worker -l info -Q documents,media --concurrency=${DOCUMENT_WORKER_CONCURRENCY:-2} --prefetch-multiplier=1
    env_file:
      - ./.env.docker
    environment:
      IFACEOFF_RUN_MIGRATIONS: "0"
      IFACEOFF_COLLECTSTATIC: "0"
      IFACEOFF_DATABASE_URL: postgresql://${IFACEOFF_DB_USER:-ifaceoff_app}:${IFACEOFF_DB_PASSWORD:-ifaceoff-app-change-me}@postgres:5432/${IFACEOFF_DB_NAME:-ifaceoff_app}
      AGENT_DATABASE_URL: postgresql://${AGENT_DB_USER:-ifaceoff_agent}:${AGENT_DB_PASSWORD:-ifaceoff-agent-change-me}@postgres:5432/${AGENT_DB_NAME:-ifaceoff_agent}
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      REDIS_REALTIME_URL: redis://redis-realtime:6379/0
      RABBITMQ_HOST: rabbitmq
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ifaceoff_network

  redis-cache:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory ${REDIS_CACHE_MAXMEMORY:-1gb} --maxmemory-policy allkeys-lfu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ifaceoff_network

  redis-realtime:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    restart: unless-stopped
    volumes:
      - redis_realtime_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ifaceoff_network

volumes:
  redis_realtime_data:
