global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: ifaceoff-backend
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
