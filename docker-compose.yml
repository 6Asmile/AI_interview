name: ifaceoff

services:
  backend:
    build:
      context: ./ai_interview_backend
    image: ifaceoff/backend:latest
    container_name: Ifaceoff-backend
    command: uvicorn ai_interview_backend.asgi:application --host 0.0.0.0 --port 8000
    env_file:
      - ./.env.docker
    environment:
      IFACEOFF_RUN_MIGRATIONS: "1"
      IFACEOFF_COLLECTSTATIC: "1"
      IFACEOFF_SETUP_AGENT_CHECKPOINT: "1"
      IFACEOFF_DATABASE_URL: postgresql://${IFACEOFF_DB_USER:-ifaceoff_app}:${IFACEOFF_DB_PASSWORD:-ifaceoff-app-change-me}@postgres:5432/${IFACEOFF_DB_NAME:-ifaceoff_app}
      AGENT_DATABASE_URL: postgresql://${AGENT_DB_USER:-ifaceoff_agent}:${AGENT_DB_PASSWORD:-ifaceoff-agent-change-me}@postgres:5432/${AGENT_DB_NAME:-ifaceoff_agent}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_COORDINATION_URL: redis://redis:6379/2
      REDIS_REALTIME_URL: redis://redis:6379/3
      CELERY_TOPOLOGY_VERSION: ${CELERY_TOPOLOGY_VERSION:-v2}
      RABBITMQ_HOST: rabbitmq
      QDRANT_URL: http://qdrant:6333
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:-ifaceoff-local-search-key}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      celery-topology:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8000/api/v1/schema/', timeout=5)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ifaceoff_network

  agent-service:
    image: ifaceoff/backend:latest
    container_name: Ifaceoff-agent-service
    command: uvicorn agent_service.app:app --host 0.0.0.0 --port 8010
    env_file:
      - ./.env.docker
    environment:
      IFACEOFF_RUN_MIGRATIONS: "0"
      IFACEOFF_COLLECTSTATIC: "0"
      IFACEOFF_SETUP_AGENT_CHECKPOINT: "0"
      IFACEOFF_DATABASE_URL: postgresql://${IFACEOFF_DB_USER:-ifaceoff_app}:${IFACEOFF_DB_PASSWORD:-ifaceoff-app-change-me}@postgres:5432/${IFACEOFF_DB_NAME:-ifaceoff_app}
      AGENT_DATABASE_URL: postgresql://${AGENT_DB_USER:-ifaceoff_agent}:${AGENT_DB_PASSWORD:-ifaceoff-agent-change-me}@postgres:5432/${AGENT_DB_NAME:-ifaceoff_agent}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_COORDINATION_URL: redis://redis:6379/2
      REDIS_REALTIME_URL: redis://redis:6379/3
      CELERY_TOPOLOGY_VERSION: ${CELERY_TOPOLOGY_VERSION:-v2}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${AGENT_SERVICE_PORT:-8010}:8010"
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ifaceoff_network

  celery-worker:
    image: ifaceoff/backend:latest
    container_name: Ifaceoff-celery-worker
    command: celery -A ai_interview_backend worker -l info -P solo --hostname=dev@%h -Q ifaceoff.${CELERY_TOPOLOGY_VERSION:-v2}.default,ifaceoff.${CELERY_TOPOLOGY_VERSION:-v2}.agent.interactive,ifaceoff.${CELERY_TOPOLOGY_VERSION:-v2}.career.analysis,ifaceoff.${CELERY_TOPOLOGY_VERSION:-v2}.documents,ifaceoff.${CELERY_TOPOLOGY_VERSION:-v2}.resume.render,ifaceoff.${CELERY_TOPOLOGY_VERSION:-v2}.media,ifaceoff.${CELERY_TOPOLOGY_VERSION:-v2}.community.moderation,ifaceoff.${CELERY_TOPOLOGY_VERSION:-v2}.notifications,ifaceoff.${CELERY_TOPOLOGY_VERSION:-v2}.search.index,ifaceoff.${CELERY_TOPOLOGY_VERSION:-v2}.events,ifaceoff.${CELERY_TOPOLOGY_VERSION:-v2}.publisher
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - ./.env.docker
    environment:
      IFACEOFF_RUN_MIGRATIONS: "0"
      IFACEOFF_COLLECTSTATIC: "0"
      IFACEOFF_DATABASE_URL: postgresql://${IFACEOFF_DB_USER:-ifaceoff_app}:${IFACEOFF_DB_PASSWORD:-ifaceoff-app-change-me}@postgres:5432/${IFACEOFF_DB_NAME:-ifaceoff_app}
      AGENT_DATABASE_URL: postgresql://${AGENT_DB_USER:-ifaceoff_agent}:${AGENT_DB_PASSWORD:-ifaceoff-agent-change-me}@postgres:5432/${AGENT_DB_NAME:-ifaceoff_agent}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_COORDINATION_URL: redis://redis:6379/2
      REDIS_REALTIME_URL: redis://redis:6379/3
      CELERY_TOPOLOGY_VERSION: ${CELERY_TOPOLOGY_VERSION:-v2}
      RABBITMQ_HOST: rabbitmq
      QDRANT_URL: http://qdrant:6333
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:-ifaceoff-local-search-key}
    volumes:
      - media_volume:/app/media
    depends_on:
      backend:
        condition: service_healthy
      celery-topology:
        condition: service_completed_successfully
      meilisearch:
        condition: service_healthy
    networks:
      - ifaceoff_network

  celery-beat:
    image: ifaceoff/backend:latest
    container_name: Ifaceoff-celery-beat
    command: celery -A ai_interview_backend beat -l info --schedule=/var/run/celery/celerybeat-schedule
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      IFACEOFF_RUN_MIGRATIONS: "0"
      IFACEOFF_COLLECTSTATIC: "0"
      IFACEOFF_DATABASE_URL: postgresql://${IFACEOFF_DB_USER:-ifaceoff_app}:${IFACEOFF_DB_PASSWORD:-ifaceoff-app-change-me}@postgres:5432/${IFACEOFF_DB_NAME:-ifaceoff_app}
      AGENT_DATABASE_URL: postgresql://${AGENT_DB_USER:-ifaceoff_agent}:${AGENT_DB_PASSWORD:-ifaceoff-agent-change-me}@postgres:5432/${AGENT_DB_NAME:-ifaceoff_agent}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_COORDINATION_URL: redis://redis:6379/2
      REDIS_REALTIME_URL: redis://redis:6379/3
      CELERY_TOPOLOGY_VERSION: ${CELERY_TOPOLOGY_VERSION:-v2}
      RABBITMQ_HOST: rabbitmq
      QDRANT_URL: http://qdrant:6333
    depends_on:
      backend:
        condition: service_healthy
      celery-topology:
        condition: service_completed_successfully
    volumes:
      - celery_beat_data:/var/run/celery
    networks:
      - ifaceoff_network

  celery-topology:
    image: ifaceoff/backend:latest
    container_name: Ifaceoff-celery-topology
    command: python manage.py declare_celery_topology --max-retries=10
    env_file:
      - ./.env.docker
    environment:
      IFACEOFF_RUN_MIGRATIONS: "0"
      IFACEOFF_COLLECTSTATIC: "0"
      IFACEOFF_SETUP_AGENT_CHECKPOINT: "0"
      IFACEOFF_DATABASE_URL: postgresql://${IFACEOFF_DB_USER:-ifaceoff_app}:${IFACEOFF_DB_PASSWORD:-ifaceoff-app-change-me}@postgres:5432/${IFACEOFF_DB_NAME:-ifaceoff_app}
      AGENT_DATABASE_URL: postgresql://${AGENT_DB_USER:-ifaceoff_agent}:${AGENT_DB_PASSWORD:-ifaceoff-agent-change-me}@postgres:5432/${AGENT_DB_NAME:-ifaceoff_agent}
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_COORDINATION_URL: redis://redis:6379/2
      REDIS_REALTIME_URL: redis://redis:6379/3
      RABBITMQ_HOST: rabbitmq
      CELERY_TOPOLOGY_VERSION: ${CELERY_TOPOLOGY_VERSION:-v2}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"
    networks:
      - ifaceoff_network

  frontend:
    build:
      context: ./ai-interview-frontend
      dockerfile: Dockerfile
    image: ifaceoff/frontend:latest
    container_name: Ifaceoff-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ifaceoff_network

  postgres:
    image: postgres:16-alpine
    container_name: Ifaceoff-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-ifaceoff_admin}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-ifaceoff-admin-change-me}
      POSTGRES_DB: postgres
      IFACEOFF_DB_NAME: ${IFACEOFF_DB_NAME:-ifaceoff_app}
      IFACEOFF_DB_USER: ${IFACEOFF_DB_USER:-ifaceoff_app}
      IFACEOFF_DB_PASSWORD: ${IFACEOFF_DB_PASSWORD:-ifaceoff-app-change-me}
      AGENT_DB_NAME: ${AGENT_DB_NAME:-ifaceoff_agent}
      AGENT_DB_USER: ${AGENT_DB_USER:-ifaceoff_agent}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-ifaceoff-agent-change-me}
      LITELLM_DB_NAME: ${LITELLM_DB_NAME:-litellm}
      LITELLM_DB_USER: ${LITELLM_DB_USER:-litellm}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm-change-me}
      LANGFUSE_DB_NAME: ${LANGFUSE_DB_NAME:-langfuse}
      LANGFUSE_DB_USER: ${LANGFUSE_DB_USER:-langfuse}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse-change-me}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/10-ifaceoff-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - ifaceoff_network

  redis:
    image: redis:7-alpine
    container_name: Ifaceoff-redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "${REDIS_PORT_PUBLIC:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ifaceoff_network

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.3.4-management-alpine}
    container_name: Ifaceoff-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - ifaceoff_network

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: Ifaceoff-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ifaceoff_network

  meilisearch:
    image: getmeili/meilisearch:v1.45.1
    container_name: Ifaceoff-meilisearch
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-ifaceoff-local-search-key}
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - ifaceoff_network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  celery_beat_data:
  static_volume:
  media_volume:
  qdrant_data:
  meilisearch_data:

networks:
  ifaceoff_network:
    name: Ifaceoff-network
    driver: bridge
