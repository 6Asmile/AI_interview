name: ifaceoff

services:
  backend:
    build:
      context: ./ai_interview_backend
    image: ifaceoff/backend:latest
    container_name: Ifaceoff-backend
    command: uvicorn ai_interview_backend.asgi:application --host 0.0.0.0 --port 8000
    env_file:
      - ./.env.docker
    environment:
      IFACEOFF_RUN_MIGRATIONS: "1"
      IFACEOFF_COLLECTSTATIC: "1"
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      QDRANT_URL: http://qdrant:6333
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8000/api/v1/schema/', timeout=5)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ifaceoff_network

  celery-worker:
    image: ifaceoff/backend:latest
    container_name: Ifaceoff-celery-worker
    command: celery -A ai_interview_backend worker -l info -P solo
    env_file:
      - ./.env.docker
    environment:
      IFACEOFF_RUN_MIGRATIONS: "0"
      IFACEOFF_COLLECTSTATIC: "0"
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      QDRANT_URL: http://qdrant:6333
    volumes:
      - media_volume:/app/media
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ifaceoff_network

  celery-beat:
    image: ifaceoff/backend:latest
    container_name: Ifaceoff-celery-beat
    command: celery -A ai_interview_backend beat -l info --schedule=/tmp/celerybeat-schedule
    env_file:
      - ./.env.docker
    environment:
      IFACEOFF_RUN_MIGRATIONS: "0"
      IFACEOFF_COLLECTSTATIC: "0"
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      QDRANT_URL: http://qdrant:6333
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ifaceoff_network

  frontend:
    build:
      context: ./ai-interview-frontend
      dockerfile: Dockerfile
    image: ifaceoff/frontend:latest
    container_name: Ifaceoff-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ifaceoff_network

  db:
    image: mysql:8.0
    container_name: Ifaceoff-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ifaceoff_root}
      MYSQL_DATABASE: ${DB_NAME:-ifaceoff}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - ifaceoff_network

  redis:
    image: redis:7-alpine
    container_name: Ifaceoff-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT_PUBLIC:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ifaceoff_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: Ifaceoff-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - ifaceoff_network

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: Ifaceoff-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ifaceoff_network

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:
  qdrant_data:

networks:
  ifaceoff_network:
    name: Ifaceoff-network
    driver: bridge
