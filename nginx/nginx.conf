server {
    listen 80;
    server_name localhost;

    location /static/ {
        alias /var/www/static/;
    }
    
    location /media/ {
        alias /var/www/media/;
    }

    # 【核心修复】为 Django Admin 创建一个独立的、高优先级的 location 块
    # ^~ 表示这是一个优先匹配的、非正则的 location，一旦匹配成功，就不会再检查其他正则 location
    location ^~ /admin/ {
        proxy_pass http://backend:8000; # 直接转发，不做任何重写
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 【核心修复】将 API 请求的 location 块拆分开，逻辑更清晰
    # 只处理 /api/ 和 /auth/ 开头的请求
    location ~ ^/(api|auth)/ {
        # 如果请求的 URI 不是以 /api/v1/ 开头，
        # 就在它的前面加上 /api/v1
        if ($request_uri !~* "^/api/v1/") {
            rewrite ^/(.*)$ /api/v1/$1 break;
        }

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端 SPA 的 location 块 (保持不变)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}