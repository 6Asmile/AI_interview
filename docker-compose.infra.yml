name: ifaceoff-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: Ifaceoff-infra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-ifaceoff_admin}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-ifaceoff-admin-change-me}
      POSTGRES_DB: postgres
      IFACEOFF_DB_NAME: ${IFACEOFF_DB_NAME:-ifaceoff_app}
      IFACEOFF_DB_USER: ${IFACEOFF_DB_USER:-ifaceoff_app}
      IFACEOFF_DB_PASSWORD: ${IFACEOFF_DB_PASSWORD:-ifaceoff-app-change-me}
      AGENT_DB_NAME: ${AGENT_DB_NAME:-ifaceoff_agent}
      AGENT_DB_USER: ${AGENT_DB_USER:-ifaceoff_agent}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-ifaceoff-agent-change-me}
      LITELLM_DB_NAME: ${LITELLM_DB_NAME:-litellm}
      LITELLM_DB_USER: ${LITELLM_DB_USER:-litellm}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm-change-me}
      LANGFUSE_DB_NAME: ${LANGFUSE_DB_NAME:-langfuse}
      LANGFUSE_DB_USER: ${LANGFUSE_DB_USER:-langfuse}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse-change-me}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ifaceoff_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/10-ifaceoff-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - ifaceoff_infra_network

  redis-cache:
    image: ${REDIS_IMAGE:-redis:7.4.5-alpine}
    container_name: Ifaceoff-infra-redis-cache
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory ${REDIS_CACHE_MAXMEMORY:-1gb} --maxmemory-policy allkeys-lfu
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && test \"$$(redis-cli --raw CONFIG GET maxmemory-policy | tail -n 1)\" = allkeys-lfu && test $$(redis-cli --raw CONFIG GET maxmemory | tail -n 1) -gt 0"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ifaceoff_infra_network

  redis-coordination:
    image: ${REDIS_IMAGE:-redis:7.4.5-alpine}
    container_name: Ifaceoff-infra-redis-coordination
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory ${REDIS_COORDINATION_MAXMEMORY:-512mb} --maxmemory-policy noeviction
    ports:
      - "${REDIS_COORDINATION_PORT:-6380}:6379"
    volumes:
      - ifaceoff_redis_coordination_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && test \"$$(redis-cli --raw CONFIG GET maxmemory-policy | tail -n 1)\" = noeviction && test \"$$(redis-cli --raw CONFIG GET appendonly | tail -n 1)\" = yes && test $$(redis-cli --raw CONFIG GET maxmemory | tail -n 1) -gt 0"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ifaceoff_infra_network

  redis-realtime:
    image: ${REDIS_IMAGE:-redis:7.4.5-alpine}
    container_name: Ifaceoff-infra-redis-realtime
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory ${REDIS_REALTIME_MAXMEMORY:-1gb} --maxmemory-policy noeviction
    ports:
      - "${REDIS_REALTIME_PORT:-6381}:6379"
    volumes:
      - ifaceoff_redis_realtime_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && test \"$$(redis-cli --raw CONFIG GET maxmemory-policy | tail -n 1)\" = noeviction && test \"$$(redis-cli --raw CONFIG GET appendonly | tail -n 1)\" = yes && test $$(redis-cli --raw CONFIG GET maxmemory | tail -n 1) -gt 0"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ifaceoff_infra_network

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.3.4-management-alpine}
    container_name: Ifaceoff-infra-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ifaceoff_rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - ifaceoff_infra_network

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: Ifaceoff-infra-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ifaceoff_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ifaceoff_infra_network

  litellm:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm@sha256:2fdd90b14e3d9244ce297f418b983d8cfd90ba6e72a10a8ddb30f7cf64852390}
    container_name: Ifaceoff-infra-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-ifaceoff-local-master-change-me}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-ifaceoff-local-salt-change-me}
      DATABASE_URL: postgresql://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD:-litellm-change-me}@postgres:5432/${LITELLM_DB_NAME:-litellm}
      STORE_MODEL_IN_DB: "True"
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 30s
    networks:
      - ifaceoff_infra_network

  meilisearch:
    image: getmeili/meilisearch:v1.45.1
    container_name: Ifaceoff-infra-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-ifaceoff-local-search-key}
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - ifaceoff_meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - ifaceoff_infra_network

  clamav:
    image: clamav/clamav:1.5
    container_name: Ifaceoff-infra-clamav
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - ifaceoff_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - ifaceoff_infra_network

volumes:
  ifaceoff_postgres_data:
    name: Ifaceoff-infra-postgres-data
  ifaceoff_redis_coordination_data:
    name: Ifaceoff-infra-redis-coordination-data
  ifaceoff_redis_realtime_data:
    name: Ifaceoff-infra-redis-realtime-data
  ifaceoff_rabbitmq_data:
    name: Ifaceoff-infra-rabbitmq-data
  ifaceoff_qdrant_data:
    name: Ifaceoff-infra-qdrant-data
  ifaceoff_meilisearch_data:
    name: Ifaceoff-infra-meilisearch-data
  ifaceoff_clamav_data:
    name: Ifaceoff-infra-clamav-data

networks:
  ifaceoff_infra_network:
    name: Ifaceoff-infra-network
    driver: bridge
